<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#1a3d2f"/><g transform="translate(90 140) rotate(-3)"><rect width="360" height="500" fill="#f2eee5"/><text x="35" y="65" font-family="Arial" font-size="16">01 / 04</text><text x="35" y="150" font-family="Arial" font-weight="700" font-size="46">Una planta</text><text x="35" y="202" font-family="Arial" font-weight="700" font-size="46">también</text><text x="35" y="254" font-family="Arial" font-weight="700" font-size="46">te habla.</text><circle cx="180" cy="375" r="75" fill="#ff786f"/></g><g transform="translate(520 190) rotate(4)"><rect width="360" height="500" fill="#e4ff78"/><text x="35" y="65" font-family="Arial" font-size="16">02 / 04</text><text x="35" y="145" font-family="Arial" font-weight="700" font-size="40">Hojas bajas</text><text x="35" y="192" font-family="Arial" font-weight="700" font-size="40">no siempre</text><text x="35" y="239" font-family="Arial" font-weight="700" font-size="40">son sed.</text><path d="M90 330q90-100 180 0q-90 100-180 0Z" fill="#1a3d2f"/></g><g transform="translate(940 120) rotate(-5)"><rect width="360" height="500" fill="#ff786f"/><text x="35" y="65" font-family="Arial" font-size="16">03 / 04</text><text x="35" y="150" font-family="Arial" font-weight="700" font-size="43">Mira la luz.</text><text x="35" y="210" font-family="Arial" font-size="24">Después, toca la tierra.</text><circle cx="180" cy="360" r="85" fill="#f2eee5"/><circle cx="180" cy="360" r="34" fill="#1a3d2f"/></g></svg>
